<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jijiga Electricity</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f9;
    color: #17202a;
}

header {
    background: #0b5d4b;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

header p {
    margin: 0;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card strong {
    display: block;
    font-size: 28px;
    margin-top: 8px;
}

.green {
    color: #16803c;
}

.red {
    color: #c62828;
}

.yellow {
    color: #b77900;
}

.gray {
    color: #667085;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.panel h2 {
    margin-top: 0;
}

.kebeles {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.kebele {
    border: 1px solid #e1e6ea;
    border-radius: 10px;
    padding: 14px;
    background: white;
}

.kebele-name {
    font-weight: bold;
    margin-bottom: 8px;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.on {
    background: #dff6e7;
    color: #126b34;
}

.off {
    background: #fde3e3;
    color: #a51f1f;
}

.unstable {
    background: #fff0c7;
    color: #875f00;
}

.unknown {
    background: #edf0f2;
    color: #667085;
}

.recent-reports {
    margin-top: 10px;
    font-size: 12px;
    color: #667085;
    line-height: 1.7;
}

select,
button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccd3d8;
    font-size: 16px;
}

button {
    background: #0b5d4b;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #999;
}

.message {
    color: #0b5d4b;
    font-weight: bold;
}

.error {
    color: #c62828;
}

footer {
    text-align: center;
    padding: 25px;
    color: #667085;
    font-size: 13px;
}

@media (max-width: 700px) {
    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .kebeles {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>⚡ Jijiga Electricity</h1>
    <p>Electricity status for Jijiga city</p>
</header>

<main>

<div class="summary">
    <div class="card green">
        🟢 ON
        <strong id="onCount">0</strong>
    </div>

    <div class="card red">
        🔴 OFF
        <strong id="offCount">0</strong>
    </div>

    <div class="card yellow">
        🟡 UNSTABLE
        <strong id="unstableCount">0</strong>
    </div>

    <div class="card gray">
        ⚪ UNKNOWN
        <strong id="unknownCount">20</strong>
    </div>
</div>
<div class="panel">
    <h2>🗺️ Jijiga Electricity Map</h2>
    <div id="map" style="height:400px;border-radius:12px;"></div>
</div>
<div class="panel">

    <h2>🗺️ Jijiga Urban Kebeles</h2>

    <p>
        Check the latest reported electricity status in each Kebele.
    </p>

    <div class="kebeles" id="kebeles"></div>

</div>

<div class="panel">

    <h2>📍 Report Electricity Status</h2>

    <label>Select your Kebele</label>

    <select id="kebeleSelect"></select>

    <label>What is the electricity situation?</label>

    <select id="statusSelect">
        <option value="on">🟢 Electricity is ON</option>
        <option value="off">🔴 Electricity is OFF</option>
        <option value="unstable">🟡 Electricity is UNSTABLE</option>
    </select>

    <button id="submitButton" onclick="submitReport()">
        Submit Report
    </button>

    <p id="message" class="message"></p>

</div>

</main>

<footer>
    Jijiga Electricity © 2026
</footer>
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://wvenavpgdlbrlqpnqjlb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_4utSOBVLpg1hPvXb9GtkzA_c9_bUxcu";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const kebeles = [];

for (let i = 1; i <= 20; i++) {
    kebeles.push(
        "Kebele " + String(i).padStart(2, "0")
    );
}


let reports = [];


/* ---------------------------
   TIME AGO
---------------------------- */

function timeAgo(date) {

    const seconds =
        Math.floor(
            (Date.now() - new Date(date)) / 1000
        );

    if (seconds < 60) {
        return "just now";
    }

    const minutes =
        Math.floor(seconds / 60);

    if (minutes < 60) {
        return minutes +
            (minutes === 1
                ? " minute ago"
                : " minutes ago");
    }

    const hours =
        Math.floor(minutes / 60);

    if (hours < 24) {
        return hours +
            (hours === 1
                ? " hour ago"
                : " hours ago");
    }

    const days =
        Math.floor(hours / 24);

    return days +
        (days === 1
            ? " day ago"
            : " days ago");
}


/* ---------------------------
   LATEST REPORT
---------------------------- */

function getLatestReport(kebele) {

    const results =
        reports.filter(
            report => report.kebele === kebele
        );

    if (results.length === 0) {
        return null;
    }

    return results[results.length - 1];
}


/* ---------------------------
   DISPLAY KEBELES
---------------------------- */

function displayKebeles() {

    const container =
        document.getElementById("kebeles");

    const select =
        document.getElementById("kebeleSelect");

    container.innerHTML = "";
    select.innerHTML = "";

    let on = 0;
    let off = 0;
    let unstable = 0;
    let unknown = 0;


    kebeles.forEach(kebele => {

        const report =
            getLatestReport(kebele);

        let status =
            report
                ? report.status
                : "unknown";


        /*
          Only reports from the
          last 6 hours count as current.
        */

        const sixHoursAgo =
            Date.now() -
            (6 * 60 * 60 * 1000);


        const recentReports =
            reports.filter(report =>

                report.kebele === kebele &&

                new Date(report.created_at).getTime()
                    >= sixHoursAgo

            );


        /*
          Determine current status
          using the latest recent report.
        */

        const latestRecentReport =
            recentReports.length > 0
                ? recentReports[recentReports.length - 1]
                : null;


        if (latestRecentReport) {
            status =
                latestRecentReport.status;
        } else {
            status = "unknown";
        }


        if (status === "on") {
            on++;
        }

        if (status === "off") {
            off++;
        }

        if (status === "unstable") {
            unstable++;
        }

        if (status === "unknown") {
            unknown++;
        }


        let text = "⚪ UNKNOWN";

        if (status === "on") {
            text = "🟢 ON";
        }

        if (status === "off") {
            text = "🔴 OFF";
        }

        if (status === "unstable") {
            text = "🟡 UNSTABLE";
        }


        /*
          Count recent reports
          by status.
        */

        const offReports =
            recentReports.filter(
                report => report.status === "off"
            ).length;

        const onReports =
            recentReports.filter(
                report => report.status === "on"
            ).length;

        const unstableReports =
            recentReports.filter(
                report => report.status === "unstable"
            ).length;


        let reportBreakdown = "";


        if (offReports > 0) {
            reportBreakdown +=
                "🔴 " +
                offReports +
                " OFF<br>";
        }

        if (onReports > 0) {
            reportBreakdown +=
                "🟢 " +
                onReports +
                " ON<br>";
        }

        if (unstableReports > 0) {
            reportBreakdown +=
                "🟡 " +
                unstableReports +
                " UNSTABLE";
        }


        const reportCount =
            recentReports.length;


        const box =
            document.createElement("div");

        box.className = "kebele";


        let cardHTML = "";

        cardHTML +=
            '<div class="kebele-name">' +
            kebele +
            "</div>";


        cardHTML +=
            '<span class="status ' +
            status +
            '">' +
            text +
            "</span>";


        if (latestRecentReport) {

            cardHTML +=
                '<div style="margin-top:8px;font-size:12px;color:#667085;">' +
                "Reported " +
                timeAgo(
                    latestRecentReport.created_at
                ) +
                "</div>";

        }


        if (reportCount > 0) {

            cardHTML +=
                '<div class="recent-reports">' +
                reportCount +
                " recent " +
                (reportCount === 1
                    ? "report"
                    : "reports") +
                "<br>" +
                reportBreakdown +
                "</div>";

        }


        box.innerHTML = cardHTML;

        container.appendChild(box);


        const option =
            document.createElement("option");

        option.value = kebele;

        option.textContent = kebele;

        select.appendChild(option);

    });


    document.getElementById("onCount")
        .textContent = on;

    document.getElementById("offCount")
        .textContent = off;

    document.getElementById("unstableCount")
        .textContent = unstable;

    document.getElementById("unknownCount")
        .textContent = unknown;
}


/* ---------------------------
   LOAD REPORTS
---------------------------- */

async function loadReports() {

    const {
        data,
        error
    } = await supabaseClient

        .from("reports")

        .select("*")

        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        document.getElementById(
            "message"
        ).textContent =
            "⚠️ Could not load reports.";

        document.getElementById(
            "message"
        ).className =
            "message error";

        return;
    }


    reports = data || [];

    displayKebeles();
}


/* ---------------------------
   SUBMIT REPORT
---------------------------- */

async function submitReport() {

    const kebele =
        document.getElementById(
            "kebeleSelect"
        ).value;

    const status =
        document.getElementById(
            "statusSelect"
        ).value;


    /*
      6-HOUR DEVICE PROTECTION
    */

    const lastReportKey =
        "lastReport_" + kebele;

    const lastReportTime =
        localStorage.getItem(
            lastReportKey
        );


    if (lastReportTime) {

        const hoursPassed =
            (
                Date.now() -
                Number(lastReportTime)
            ) /
            (1000 * 60 * 60);


        if (hoursPassed < 6) {

            const remainingHours =
                6 - hoursPassed;

            const remainingMinutes =
                Math.ceil(
                    remainingHours * 60
                );


            document.getElementById(
                "message"
            ).textContent =
                "⏳ You already reported this Kebele. Please try again in about " +
                remainingMinutes +
                " minutes.";

            document.getElementById(
                "message"
            ).className =
                "message error";

            return;
        }
    }


    const button =
        document.getElementById(
            "submitButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    button.disabled = true;

    button.textContent =
        "Submitting...";


    /*
      Save report
    */

    const {
        error
    } = await supabaseClient

        .from("reports")

        .insert({
            kebele: kebele,
            status: status
        });


    if (error) {

        console.error(error);

        message.textContent =
            "❌ Report could not be submitted.";

        message.className =
            "message error";

    } else {

        /*
          Save local 6-hour timer
        */

        localStorage.setItem(
            "lastReport_" + kebele,
            Date.now().toString()
        );


        message.textContent =
            "✅ Your report has been recorded.";

        message.className =
            "message";


        await loadReports();
    }


    button.disabled = false;

    button.textContent =
        "Submit Report";
}


/* ---------------------------
   REALTIME UPDATES
---------------------------- */

supabaseClient

    .channel(
        "reports-realtime"
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "reports"
        },

        function() {
            loadReports();
        }
    )

    .subscribe();


/* ---------------------------
   START
---------------------------- */
const map = L.map("map").setView(
    [9.3500, 42.8000],
    13
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/*
   Load Kebele boundaries around Jijiga/Fafan
   and connect them to recent electricity reports.
*/

const sixHoursAgo =
    Date.now() - (6 * 60 * 60 * 1000);


function getKebeleStatus(kebeleName) {

    const recentReports =
        reports.filter(report => {

            return (
                report.kebele === kebeleName &&
                new Date(report.created_at).getTime()
                    >= sixHoursAgo
            );

        });


    if (recentReports.length === 0) {
        return {
            status: "unknown",
            count: 0
        };
    }


    const latest =
        recentReports[
            recentReports.length - 1
        ];


    return {
        status: latest.status,
        count: recentReports.length
    };
}


function getMapColor(status) {

    if (status === "on") {
        return "#16803c";
    }

    if (status === "off") {
        return "#c62828";
    }

    if (status === "unstable") {
        return "#b77900";
    }

    return "#667085";
}


function getMapText(status) {

    if (status === "on") {
        return "🟢 ON";
    }

    if (status === "off") {
        return "🔴 OFF";
    }

    if (status === "unstable") {
        return "🟡 UNSTABLE";
    }

    return "⚪ UNKNOWN";
}


/*
   Jijiga/Fafan Kebele polygons.
*/

const query =
    "R_NAME='Somali' AND W_NAME='Fafan'";


const url =
    "https://services8.arcgis.com/oTalEaSXAuyNT7xf/arcgis/rest/services/Ethiopia_AdminBoundaries/FeatureServer/0/query" +
    "?where=" +
    encodeURIComponent(query) +
    "&outFields=R_NAME,W_NAME,UK_NAME,KK_NAME" +
    "&returnGeometry=true" +
    "&outSR=4326" +
    "&f=geojson";


fetch(url)

.then(response => response.json())

.then(data => {

    L.geoJSON(data, {

        style: function(feature) {

            const name =
                feature.properties.KK_NAME ||
                feature.properties.UK_NAME ||
                "Unknown Kebele";


            const result =
                getKebeleStatus(name);


            return {

                color:
                    getMapColor(
                        result.status
                    ),

                weight: 2,

                fillColor:
                    getMapColor(
                        result.status
                    ),

                fillOpacity: 0.35

            };

        },


        onEachFeature:
            function(feature, layer) {

                const name =
                    feature.properties.KK_NAME ||
                    feature.properties.UK_NAME ||
                    "Unknown Kebele";


                const result =
                    getKebeleStatus(name);


                layer.bindPopup(

                    "<strong>" +
                    name +
                    "</strong><br><br>" +

                    getMapText(
                        result.status
                    ) +

                    "<br>" +

                    result.count +

                    " recent " +

                    (
                        result.count === 1
                            ? "report"
                            : "reports"
                    )

                );

            }

    }).addTo(map);

})


.catch(error => {

    console.error(
        "Could not load Jijiga boundaries:",
        error
    );

});
L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* Real Ethiopia Kebele boundaries */
fetch(
    "https://services8.arcgis.com/oTalEaSXAuyNT7xf/arcgis/rest/services/Ethiopia_AdminBoundaries/FeatureServer/0/query?where=R_NAME%3D%27Somali%27&outFields=*&returnGeometry=true&outSR=4326&f=geojson"
)
.then(response => response.json())
.then(data => {

    L.geoJSON(data, {

        style: {
            color: "#0b5d4b",
            weight: 1,
            fillOpacity: 0.08
        },

        onEachFeature: function(feature, layer) {

            const name =
                feature.properties.KK_NAME ||
                feature.properties.UK_NAME ||
                "Kebele";

            layer.bindPopup(
                "<strong>" +
                name +
                "</strong><br>" +
                "Jijiga Electricity"
            );

        }

    }).addTo(map);

})
.catch(error => {
    console.error(
        "Could not load Kebele boundaries:",
        error
    );
});
    const legend = L.control({ position: "bottomright" });

legend.onAdd = function () {
    const div = L.DomUtil.create("div", "map-legend");

    div.innerHTML =
        "<strong>Electricity Status</strong><br>" +
        "<span style='color:#16803c;'>●</span> ON<br>" +
        "<span style='color:#c62828;'>●</span> OFF<br>" +
        "<span style='color:#b77900;'>●</span> UNSTABLE<br>" +
        "<span style='color:#667085;'>●</span> UNKNOWN";

    return div;
};

legend.addTo(map);
displayKebeles();

loadReports();

</script>

</body>
</html>
